{% extends "base.html" %}

{% block content %}
    <h1 class="section_header">Confirm remove action</h1>
    <p class="confirm_text"> Remove the song <span class="bold_confirm">{{number}} - {{title}}</span></p>
    <form method="POST" action="/remove/{{number}}">
        <div class="actions">
        <button type="submit" name="action" value="cancel"> Cancel </button>
        <button class="primary" type="submit" name="action" value="remove"> Remove </button>  
        </div>
    </form>
    


{% endblock%}
