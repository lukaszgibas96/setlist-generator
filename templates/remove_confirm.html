{% extends "base.html" %}

{% block content %}
    <h1 class="section_header">Confirm remove action</h1>
    <p> Do you want remove the song " {{number}} - {{title}} " from database? </p>
    <form method="POST" action="/remove/{{number}}">
        <button class="primary" type="submit"> Remove </button>  
        <a href="/songs"> Cancel </a>

    </form>
    


{% endblock%}
