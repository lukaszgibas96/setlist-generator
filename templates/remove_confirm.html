{% extends "base.html" %}

{% block content %}
    <h1>Confirm remove action</h1>
    <p> Do you want remove the song " {{number}} - {{title}} " from database? </p>
    <form method="POST" action="/remove/{{number}}">
        <button type="submit"> Remove </button>  
        <a href="/songs"> Cancel </a>

    </form>
    


{% endblock%}
